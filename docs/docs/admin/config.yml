local_backend: true
backend:
  name: github
  repo: your-github-username/thaioml # TODO: Change to your actual repo
  branch: main
  base_url: https://your-oauth-proxy.workers.dev # TODO: Change to your Cloudflare OAuth Worker URL
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

media_folder: "docs/docs/assets/images"
public_folder: "assets/images"

collections:
  - name: "articles"
    label: "Articles"
    folder: "docs/docs/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "SNOMED FSN", name: "snomed_fsn", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "SNOMED Lookup", name: "snomed_lookup", widget: "snomed", required: false}
      - {label: "Type", name: "type", widget: "select", options: ["disease", "drug", "procedure", "anatomy", "physiology", "symptom", "laboratory-test", "guideline", "abbreviation", "differential-diagnosis"]}
      - {label: "Specialty", name: "specialty", widget: "list", required: false}
      - {label: "Abbreviations", name: "abbreviations", widget: "list", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Review Status", name: "review_status", widget: "select", options: ["draft", "pending", "reviewed"]}
      - {label: "Last Medical Review", name: "last_medical_review", widget: "date", format: "YYYY-MM-DD", required: false}
      - {label: "Contributor License Agreement", name: "cla_agreement", widget: "boolean", default: false, required: true, hint: "I agree to the ThaiOML CLA, granting the ThaiOML Project (and its legal successors or assignees) the right to publish, modify, and sublicense this contribution, while I retain my original copyright. Published under CC-BY-NC 4.0. [Read the full License & CLA](/guidelines/license-and-cla)"}
      - {label: "SNOMED Links", name: "snomed_links", widget: "snomed_linker", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
