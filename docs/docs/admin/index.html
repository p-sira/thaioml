<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <!-- Include the script that enables Netlify Identity on this page. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Setup Manual Init so we can register widgets before starting CMS -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Load the custom SNOMED widget (plain JS, uses CMS-provided createClass/h) -->
  <script src="snomed-widget.js"></script>

  <!-- Initialize CMS after widget is registered -->
  <script>
    CMS.init();
  </script>
</body>
</html>
