<header class="md-header" data-md-component="header">
  <nav class="custom-header" aria-label="Header">
    <!-- Left: Logo & Text -->
    <div class="custom-header-section">
      <a href="http://localhost:3000/" title="{{ config.site_name | e }}" class="logo-link">
        <img src="http://localhost:3000/logo.svg" alt="logo" class="logo-img" />
        <span class="logo-text">ThaiOML</span>
      </a>
    </div>

    <!-- Middle: Navigation Links -->
    <div class="custom-header-section custom-header-center">
      <label for="__search" class="nav-link md-header__button" title="Search">
        Search
      </label>
      <a href="http://localhost:3000/chat" class="nav-link">Ask the Library</a>
      <a href="/contribute/" class="nav-link">Contribute</a>
      <a href="/about/" class="nav-link">About</a>
    </div>

    <!-- Right: Profile / Auth -->
    <div class="custom-header-section custom-header-right" id="clerk-auth-container">
      <a href="http://localhost:3000/sign-in" class="custom-btn" id="clerk-sign-in-btn">Sign In</a>
    </div>
  </nav>

  <!-- Search Modal required by Material -->
  {% if "search" in config.plugins %}
    {% include "partials/search.html" %}
  {% endif %}
</header>
