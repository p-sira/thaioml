<header class="md-header" data-md-component="header">
  <nav class="custom-header" aria-label="Header">
    <!-- Left: Logo & Text -->
    <div class="custom-header-section">
      <a href="/" title="{{ config.site_name | e }}" class="logo-link">
        <img src="/logo.svg" alt="logo" class="logo-img" />
      </a>
    </div>

    <!-- Middle: Navigation Links -->
    <div class="custom-header-section custom-header-center">
      <label for="__search"
        class="nav-link md-header__button search-btn {% if page and page.is_homepage %}active{% endif %}" title="Search"
        aria-label="Search">
        Search
      </label>
      <a href="/chat" class="nav-link {% if page and 'chat' in page.url %}active{% endif %}">Ask the Library</a>
      <a href="/contribute/" class="nav-link {% if page and 'contribute' in page.url %}active{% endif %}">Contribute</a>
      <a href="/about/" class="nav-link {% if page and 'about' in page.url %}active{% endif %}">About</a>
    </div>

    <!-- Right: Profile / Auth -->
    <div class="custom-header-section custom-header-right" id="clerk-auth-container">
      <a href="/sign-in" class="custom-btn" id="clerk-sign-in-btn">Sign In</a>
    </div>
  </nav>

  <!-- Search Modal required by Material -->
  {% if "material/search" in config.plugins %}
  {% set search = config.plugins["material/search"] | attr("config") %}
  {% if search.enabled %}
  {% include "partials/search.html" %}
  {% endif %}
  {% endif %}
</header>
