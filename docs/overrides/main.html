{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="view-transition" content="same-origin" />
  <meta name="posthog-key" content="{{ config.extra.posthog_key }}" />
  <meta name="posthog-host" content="{{ config.extra.posthog_host }}" />
  {% if page and page.file.src_path not in ['index.md', 'about.md', 'contribute.md'] %}
  <meta name="robots" content="noai, noimageai" />
  {% endif %}
  <!-- Inline theme-blocking script: runs synchronously in <head> to prevent FOUC.
       Reads the shared thaioml-theme cookie and applies data-md-color-scheme
       before the browser paints anything, so the correct palette is always shown. -->
  <script>
    (function () {
      function getCookie(n) {
        var v = document.cookie.match('(^|;) ?' + n + '=([^;]*)(;|$)');
        return v ? v[2] : null;
      }
      var theme = getCookie('thaioml-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'darkroom' : 'leuko');
      
      document.documentElement.setAttribute('data-md-color-scheme', theme);
      try { localStorage.setItem('data-md-color-scheme', theme); } catch (_) {}
      
      var observer = new MutationObserver(function(mutations) {
        if (document.body) {
          document.body.setAttribute('data-md-color-scheme', theme);
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true });
    })();
  </script>
{% endblock %}


{% block footer %}
  {{ super() }}
  <div style="text-align: center; padding-bottom: 20px; font-size: 0.8rem; opacity: 0.7;">
    <a href="#" onclick="window.resetCookieConsent && window.resetCookieConsent(); return false;" style="color: inherit; text-decoration: underline;">Privacy & Cookie Settings</a>
  </div>
{% endblock %}
