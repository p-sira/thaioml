site_name: ThaiOML (Open Medical Library of Thailand)
site_url: https://www.thaioml.org
site_description: Community-maintained, expert-reviewed medical education database.

repo_name: GitHub
repo_url: https://github.com/p-sira/thaioml

extra:
  posthog_key: !ENV [POSTHOG_KEY, "YOUR_POSTHOG_API_KEY"]
  posthog_host: !ENV [POSTHOG_HOST, "https://us.i.posthog.com"]
  app_url: !ENV [APP_URL, "http://localhost:3000"]

hooks:
  - hooks/git_version.py

plugins:
  - search
  - thaioml-linker
  - git-revision-date-localized

theme:
  name: material
  custom_dir: overrides
  favicon: favicon.svg
  logo: logo.svg
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: leuko
      primary: custom
      accent: custom
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: darkroom
      primary: custom
      accent: custom
    # Palette toggle for progressnote mode
    - scheme: progressnote
      primary: custom
      accent: custom
  features:
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/custom-theme.css

extra_javascript:
  - javascripts/theme-accent.js
  - javascripts/analytics.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
