[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sira Pornsiriprasert", email = "code@psira.me" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-huggingface>=0.1.2",
    "langchain-openai>=1.6.0",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "posthog>=7.51.2",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pyright>=1.1.411",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "ruff>=0.16.6",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend.main:main"
ingest = "backend.scripts.ingest_snomed:main"
pull-db = "backend.scripts.pull_db:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
