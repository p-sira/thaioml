name: Deploy Backend to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Run Backend Unit Tests
        run: |
          cd backend
          uv sync
          uv run pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/905621783705/locations/global/workloadIdentityPools/github-pool/providers/github-action-provider"
          service_account: "github-deployer@thaioml.iam.gserviceaccount.com"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: thaioml-backend
          region: asia-southeast1
          source: ./backend
          env_vars: |
            DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}
            OPENROUTER_API_KEY_RAG=${{ secrets.OPENROUTER_API_KEY_RAG }}
            HUGGINGFACE_API_KEY_EMBEDDING=${{ secrets.HUGGINGFACE_API_KEY_EMBEDDING }}
            CLERK_JWKS_URL=${{ secrets.CLERK_JWKS_URL }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=5
            --service-account=github-deployer@thaioml.iam.gserviceaccount.com
