name: Deploy Frontend to Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & OpenNext
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_YW11c2VkLWhlcm1pdC01ODYuY2xlcmsuYWNjb3VudHMuZGV2JA"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/"
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: "phc_kowbTx2d6QWUCeLUQhsYLkGwsE4XZenFv8micQD9xGXp"
        run: npm run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: deploy -c wrangler.jsonc
