name: Test Workflow

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "webapp/**"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "webapp/**"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install root dependencies
        run: npm install

      - name: Install webapp dependencies
        run: cd webapp && npm install

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Run Backend Unit Tests
        run: cd backend && uv run pytest

      - name: Run Webapp Unit Tests
        run: cd webapp && npm run test

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Services
        env:
          # Disable Clerk in CI — skips ClerkProvider and clerkMiddleware so the
          # app renders fully without hitting a non-existent Clerk backend.
          # To test authenticated flows, replace with real keys from GitHub Secrets:
          #   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          #   CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_ENABLED: "false"
          NEXT_PUBLIC_POSTHOG_KEY: "phc_dummykeyforci123456789"
          POSTHOG_API_KEY: "phc_dummykeyforci123456789"
          POSTHOG_KEY: "phc_dummykeyforci123456789"
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          (cd backend && uv run uvicorn backend.main:app --port 8080) &
          (cd webapp && npm run dev) &

          # Wait for services to be ready
          npx wait-on -t 120000 http-get://127.0.0.1:3000
          npx wait-on -t 120000 http-get://127.0.0.1:8080

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium
