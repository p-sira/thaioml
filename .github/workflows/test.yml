name: Test Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install root dependencies
        run: npm install

      - name: Install webapp dependencies
        run: cd webapp && npm install

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Run Backend Unit Tests
        run: cd backend && uv run pytest

      - name: Run Webapp Unit Tests
        run: cd webapp && npm run test

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Services
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummykeyforci123456789"
          CLERK_SECRET_KEY: "sk_test_dummykeyforci123456789"
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: "phc_dummykeyforci123456789"
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          cd docs && npm install && uv sync && (uv run mkdocs serve &)
          cd backend && (uv run uvicorn backend.main:app --port 8080 &)
          cd webapp && (npm run dev &)
          npx decap-server &

          # Wait for services to be ready
          npx wait-on -t 120000 http-get://127.0.0.1:8000
          npx wait-on -t 120000 http-get://127.0.0.1:3000
          npx wait-on -t 120000 http-get://127.0.0.1:8080
          npx wait-on -t 120000 http-get://127.0.0.1:8081/api/v1

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium
